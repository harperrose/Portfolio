<!DOCTYPE html>

  <meta content="Freelance Product and Digital Designer" name="description">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
  <link href="/favicon.svg" rel="shortcut icon" type="image/svg+xml">
  <link href="/images/webclip.gif" rel="apple-touch-icon">
  <script type="text/javascript">
    (function (location) {
      if (location.search[1] === '/') {
        var decoded = location.search
          .slice(1)
          .split('&')
          .map(function (segment) {
            return segment.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(
          null,
          null,
          location.pathname.slice(0, -1) + decoded + location.hash,
        );
      }
    })(window.location);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</head>

  <div id="root"></div>
</body>
</html>
