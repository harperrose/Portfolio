name: Deploy to GitHub Pages

on:
  push:
    branches:
      - cursor/tina-webflow-integration

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TINA_PUBLIC_CLIENT_ID: 731fc6c1-4410-4e60-91d0-cafb509cd17a
      VITE_TINA_CLIENT_ID: 731fc6c1-4410-4e60-91d0-cafb509cd17a
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      TINA_BRANCH: cursor/tina-webflow-integration
      TINA_CMS_BASE_PATH: Portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
